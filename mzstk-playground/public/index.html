<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZSTK Compiler Playground</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <div class="notice">
            <strong>Note:</strong> Check out sample scripts at 
            <a href="https://github.com/arungeorgesaji/mz-stk-compiler/tree/main/samples" target="_blank">github.com/arungeorgesaji/mz-stk-compiler/samples</a>.
            <strong>Input doesn't work in this playground</strong> - avoid trying input_output.mzstk here.
            For references regarding language syntax, please read the project's README.
        </div>
        
        <h1>MZSTK Compiler Playground</h1>
        
        <div class="editor-area">
            <div class="editor-container">
                <h2>Input Code</h2>
                <textarea id="code-editor" spellcheck="false"># Enter your MZSTK code here
</textarea>
            </div>
            
            <div class="output-container">
                <h2>Output</h2>
                <pre id="output"></pre>
            </div>
        </div>
        
        <div class="controls">
            <button id="run-btn">Run (Ctrl+Enter)</button>
            <button id="clear-btn">Clear</button>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
